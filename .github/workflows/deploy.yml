name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:
  repository_dispatch:
    types: [payload_publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clean previous client build
        run: rm -rf apps/client/dist

      - name: Build client
        run: bun run build:client
        env:
          PAYLOAD_API_URL: ${{ vars.PAYLOAD_API_URL || 'https://msaharna.onrender.com' }}
          PUBLIC_POMELNIC_WORKER_URL: ${{ vars.PUBLIC_POMELNIC_WORKER_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Add nojekyll
        run: touch apps/client/dist/.nojekyll

      - name: Debug build output
        run: find apps/client/dist -maxdepth 2 -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
